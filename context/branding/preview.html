<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrchestrAI — Logo</title>
<style>
  :root {
    --bg: #12141c; --surface: #1a1d28; --border: #2c3040;
    --text: #e7e8ee; --text-muted: #9296ab; --text-faint: #6d7284;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: var(--sans); color: var(--text); }
  .page { max-width: 760px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 36px; }
  .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; display: flex; align-items: center; justify-content: center; }
  .row { display: flex; align-items: center; gap: 24px; }
  img { display: block; }
</style>
</head>
<body>
  <div class="page">
    <div>
      <div class="label">Icon mark</div>
      <div class="card"><img src="orchestrai-icon.svg" width="140" height="140" alt="OrchestrAI icon"></div>
    </div>

    <div>
      <div class="label">Favicon (16–32px, use on light or dark chrome)</div>
      <div class="row">
        <div class="card" style="padding: 12px;"><img src="orchestrai-icon-favicon.svg" width="32" height="32" alt="favicon 32px"></div>
        <div class="card" style="padding: 12px; background: #fff;"><img src="orchestrai-icon-favicon.svg" width="24" height="24" alt="favicon 24px on white"></div>
      </div>
    </div>

    <div>
      <div class="label">Wordmark</div>
      <div class="card">
        <div style="font-family: var(--mono); font-weight: 600; font-size: 44px;">Orchestr<span style="color: #5fc8d8;">AI</span></div>
      </div>
    </div>

    <div>
      <div class="label">Combined lockup</div>
      <div class="card" style="justify-content: flex-start; gap: 22px;">
        <img src="orchestrai-icon.svg" width="64" height="64" alt="">
        <div>
          <div style="font-family: var(--mono); font-weight: 600; font-size: 30px;">Orchestr<span style="color: #5fc8d8;">AI</span></div>
          <div style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-faint); text-transform: uppercase; margin-top: 2px;">Multi-agent devops orchestration</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
